{% load static %}<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | FFDB</title>
  <link rel="stylesheet" href="{% static 'repo/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__row">
      <a class="site-name" href="{% url 'repo:home' %}">FFDB</a>
      {# Each view sets nav, so the link to the section you are in is marked for screen readers and styled. #}
      <nav class="site-nav" aria-label="Main">
        <a href="{% url 'repo:materials' %}"{% if nav == "materials" %} aria-current="page"{% endif %}>Materials</a>
        <a href="{% url 'repo:references' %}"{% if nav == "references" %} aria-current="page"{% endif %}>References</a>
        <a href="{% url 'repo:properties' %}"{% if nav == "properties" %} aria-current="page"{% endif %}>Properties</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
